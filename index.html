    async function saveCell(rowKey, field, value, opts) {
      opts = opts || {};
      value = value == null ? "" : String(value);
      var cur = null;
      for (var i = 0; i < rowsCache.length; i++) {
        if (rowsCache[i].row_key === rowKey) {
          cur = rowsCache[i];
          break;
        }
      }
      if (getServerField(cur, field) === value && !opts.force) {
        clearDraft(rowKey, field);
        return;
      }
      var fillCol = fieldToFillCol(field);
      var oldFill = getServerField(cur, field);
      try {
        var body = { updated_at: new Date().toISOString() };
        if (isSnapshotField(field)) {
          var curSnap = cur && cur.snapshot && typeof cur.snapshot === "object"
            ? Object.assign({}, cur.snapshot) : {};
          curSnap[snapshotFieldKey(field)] = value;
          body.snapshot = curSnap;
        } else {
          body[field] = value;
        }
        await sbFetch("/rest/v1/t11_rows?row_key=eq." + encodeURIComponent(rowKey), {
          method: "PATCH",
          prefer: "return=minimal",
          body: body
        });
        rowsCache.forEach(function (rec) {
          if (rec.row_key === rowKey) {
            if (isSnapshotField(field)) rec.snapshot = body.snapshot;
            else rec[field] = body[field];
            rec.updated_at = body.updated_at;
          }
        });
        clearDraft(rowKey, field);
        if (!opts.silent) setStatus(appStatus, "已保存", "ok");
        else if (field === "ops" || field === "confirm_sku" || field === "eta") {
          setStatus(appStatus, "已保存 " + (field === "ops" ? COL_OPS : field === "confirm_sku" ? CONFIRM_COL : COL_ETA), "ok");
        }
        var savedInp = findInputByRowField(rowKey, field);
        markInputSaveState(savedInp, "saved");
        if (savedInp) savedInp.setAttribute("data-orig", value);
        if (fillCol) {
          await insertFillLog(cur || { row_key: rowKey, bind_prefix: bindPrefix.value }, fillCol, oldFill, value, "portal");
        }
      } catch (e) {
        markInputSaveState(findInputByRowField(rowKey, field), "failed");
        setStatus(appStatus, "保存失败：" + (e.message || e), "err");
        throw e;
      }
    }

    async function loadPrefixes() {
      var set = Object.create(null);
      var pageSize = 1000;
      var offset = 0;
      var basePath = "/rest/v1/t11_rows?select=bind_prefix&visible=eq.true";
      while (true) {
        var end = offset + pageSize - 1;
        var pack = await sbFetch(basePath, { range: offset + "-" + end, returnMeta: true });
        var chunk = pack && pack.data ? pack.data : [];
        if (!chunk || !chunk.length) break;
        chunk.forEach(function (r) {
          var p = r && r.bind_prefix ? String(r.bind_prefix) : "";
          if (p && p.indexOf("__LOG__") !== 0) set[p] = true;
        });
        var total = parseContentRangeTotal(pack.contentRange);
        if (total != null && offset + chunk.length >= total) break;
        if (chunk.length < pageSize) break;
        offset += chunk.length;
      }
      var list = Object.keys(set).sort();
      bindPrefix.innerHTML = "";
      if (!list.length) {
        var opt = document.createElement("option");
        opt.value = "";
        opt.textContent = "（暂无对外展示数据）";
        bindPrefix.appendChild(opt);
        return;
      }
      list.forEach(function (p) {
        var opt = document.createElement("option");
        opt.value = p;
        opt.textContent = p;
        bindPrefix.appendChild(opt);
      });
    }

    function ensureEditCols(cols) {
      var out = cols.slice();
      [COL_ETA, COL_OPS, CONFIRM_COL, COL_REPLACE].forEach(function (c) {
        if (out.indexOf(c) < 0) out.push(c);
      });
      return out;
    }

    /** 四列协作字段固定在最右侧，顺序：到仓时间 → 运营反馈 → 确认SKU → 替换SKU */
    function prioritizeEditCols(cols) {
      var editCols = [COL_ETA, COL_OPS, CONFIRM_COL, COL_REPLACE];
      var rest = cols.filter(function (c) { return editCols.indexOf(c) < 0; });
      var edits = editCols.filter(function (c) { return cols.indexOf(c) >= 0; });
      return rest.concat(edits);
    }

    function finalizeDisplayColumns(cols) {
      return prioritizeEditCols(ensureEditCols(cols));
    }

    function countOpsFilledInCache(list) {
      var n = 0;
      (list || rowsCache).forEach(function (rec) {
        if (String(snapVal(rec, COL_OPS) || "").trim()) n++;
      });
      return n;
    }

    async function applyDisplayColumns(pre) {
      var cfgRows = await sbFetch(
        "/rest/v1/t11_sheet_config?bind_prefix=eq." + encodeURIComponent(pre) +
        "&select=display_columns"
      );
      if (cfgRows && cfgRows[0] && Array.isArray(cfgRows[0].display_columns) &&
          cfgRows[0].display_columns.length) {
        COLS = finalizeDisplayColumns(cfgRows[0].display_columns.slice());
        return;
      }
      var set = Object.create(null);
      rowsCache.forEach(function (rec) {
        Object.keys(rec.snapshot || {}).forEach(function (k) { set[k] = true; });
      });
      COLS = FALLBACK_COLS.filter(function (c) {
        if (c === COL_ETA || c === COL_OPS || c === CONFIRM_COL) return true;
        return !!set[c];
      });
      COLS = finalizeDisplayColumns(COLS);
      if (!COLS.length) COLS = finalizeDisplayColumns(FALLBACK_COLS.slice());
    }

    async function clearCloudData() {
      if (sessionRole !== "admin") {
        setStatus(appStatus, "需要管理员密码登录才能清除云端", "err");
        return;
      }
      var pre = bindPrefix.value;
      if (!pre) {
        setStatus(appStatus, "请先选择绑定平台", "warn");
        return;
      }
      var n = rowsCache.length;
      if (!confirm(
        "确定删除平台「" + pre + "」的全部云端协作数据？\n\n" +
        "当前约 " + n + " 行；此操作不可恢复。\n" +
        "插件本地表11 不受影响，重新「推送云端」可再上传。"
      )) return;
      var typed = prompt("再次确认：请输入平台代码 " + pre);
      if (typed !== pre) {
        setStatus(appStatus, "平台代码不匹配，已取消", "warn");
        return;
      }
      setStatus(appStatus, "清除中…");
      await sbFetch("/rest/v1/rpc/t11_clear_bind_prefix", {
        method: "POST",
        body: { p_prefix: pre, p_admin_secret: adminPassword }
      });
      clearCellSelection();
      await loadPrefixes();
      await loadRows();
      setStatus(appStatus, "已清除 " + pre + " 的云端数据", "ok");
    }

    function dirtyFieldSet() {
      var set = Object.create(null);
      Object.keys(drafts).forEach(function (k) { set[k] = true; });
      Object.keys(pendingSaves).forEach(function (k) { set[k] = true; });
      Object.keys(saveTimers).forEach(function (k) {
        if (saveTimers[k]) set[k] = true;
      });
      return set;
    }

    function rowFieldDirty(dirty, rowKey, field) {
      return !!(dirty && dirty[draftKey(rowKey, field)]);
    }

    function paintServerValuesIntoDom() {
      if (!tbody) return;
      tbody.querySelectorAll("tr[data-key]").forEach(function (tr) {
        var rec = findRowByKey(tr.dataset.key);
        if (!rec) return;
        tr.querySelectorAll("input[data-field]").forEach(function (inp) {
          var field = inp.dataset.field;
          if (isDraft(rec.row_key, field)) return;
          var val = getDisplayField(rec, field);
          if (String(inp.value || "") !== val) {
            inp.value = val;
            inp.setAttribute("data-orig", val);
            markInputSaveState(inp, "");
          } else if (!inp.hasAttribute("data-orig")) {
            inp.setAttribute("data-orig", val);
          }
        });
      });
    }

    function mergeServerRows(remote) {
      pruneDraftsAgainstRows(remote);
      var dirty = dirtyFieldSet();
      var byKey = Object.create(null);
      rowsCache.forEach(function (r) {
        if (r && r.row_key) byKey[r.row_key] = r;
      });
      var identityChanged = remote.length !== rowsCache.length;
      var changed = identityChanged;
      var next = [];
      remote.forEach(function (rec, idx) {
        var cur = rec.row_key ? byKey[rec.row_key] : null;
        if (!cur) {
          next.push(rec);
          changed = true;
          identityChanged = true;
          return;
        }
        if (!identityChanged && rowsCache[idx] && rowsCache[idx].row_key !== rec.row_key) {
          identityChanged = true;
        }
        ["ops", "eta", "confirm_sku"].forEach(function (field) {
          if (rowFieldDirty(dirty, rec.row_key, field)) return;
          var nv = rec[field] != null ? String(rec[field]) : "";
          var ov = cur[field] != null ? String(cur[field]) : "";
          if (nv !== ov) {
            cur[field] = rec[field];
            changed = true;
          }
        });
        if (!rowFieldDirty(dirty, rec.row_key, "snap:" + COL_REPLACE)) {
          var ns = JSON.stringify(rec.snapshot || {});
          var os = JSON.stringify(cur.snapshot || {});
          if (ns !== os) {
            cur.snapshot = rec.snapshot;
            changed = true;
          }
        }
        cur.updated_at = rec.updated_at;
        next.push(cur);
      });
      if (changed) {
        rowsCache = next;
        invalidateDisplayRowsCache();
      }
      return { changed: changed, identityChanged: identityChanged };
    }

    async function fetchVisibleRows(pre, signal) {
      var basePath =
        "/rest/v1/t11_rows?bind_prefix=eq." + encodeURIComponent(pre) +
        "&visible=eq.true&select=*&order=updated_at.desc,row_key.asc";
      var all = [];
      var pageSize = 1000;
      var offset = 0;
      while (true) {
        var end = offset + pageSize - 1;
        var pack = await sbFetch(basePath, { range: offset + "-" + end, signal: signal, returnMeta: true });
        var chunk = pack && pack.data ? pack.data : [];
        if (!chunk || !chunk.length) break;
        all = all.concat(chunk);
        var total = parseContentRangeTotal(pack.contentRange);
        if (total != null && all.length >= total) break;
        if (chunk.length < pageSize) break;
        offset += chunk.length;
      }
      return all;
    }

    async function silentRefreshFromServer() {
      var pre = bindPrefix.value;
      if (!pre || !app || app.classList.contains("hidden")) return;
      if (document.visibilityState !== "visible") return;
      try {
        var remote = await fetchVisibleRows(pre);
        lastServerSyncAt = Date.now();
        var merge = mergeServerRows(remote);
        if (merge.changed) {
          if (merge.identityChanged) renderBody({ fromServer: true });
          else paintServerValuesIntoDom();
        }
        await loadFillLogs();
        if (merge.changed) {
          setStatus(appStatus, "共 " + rowsCache.length + " 行 · 运营反馈已填 " +
            countOpsFilledInCache(rowsCache) + "/" + rowsCache.length + "（" + pre + "）· 已从云端更新", "ok");
        }
      } catch (_) {}
    }

    function stopServerPoll() {
      if (pollTimer) {
        clearInterval(pollTimer);
        pollTimer = null;
      }
    }

    function startServerPoll() {
      stopServerPoll();
      pollTimer = setInterval(function () {
        silentRefreshFromServer();
      }, POLL_MS);
    }

    async function loadRows() {
      var pre = bindPrefix.value;
      if (!pre) {
        rowsCache = [];
        COLS = [];
        colFilters = Object.create(null);
        sortState = null;
        clearCellSelection();
        clearMultiEditSel("");
        renderHead();
        renderBody();
        await loadFillLogs();
        stopServerPoll();
        return;
      }
      loadRowsGen++;
      var myGen = loadRowsGen;
      if (loadRowsAbort) loadRowsAbort.abort();
      loadRowsAbort = new AbortController();
      var signal = loadRowsAbort.signal;
      setStatus(appStatus, "加载中…");
      clearMultiEditSel("");
      try {
        var all = await fetchVisibleRows(pre, signal);
        if (myGen !== loadRowsGen) return;
        pruneDraftsAgainstRows(all);
        rowsCache = all;
        await applyDisplayColumns(pre);
        if (myGen !== loadRowsGen) return;
        colWidths = loadWidthMap(pre);
        colFilters = loadColFilters(pre);
        sortState = loadSortState(pre);
        if (sortState && COLS.indexOf(sortState.col) < 0) sortState = null;
        invalidateDisplayRowsCache();
        lastServerSyncAt = Date.now();
        renderHead();
        renderBody({ fromServer: true });
        await loadFillLogs();
        setStatus(appStatus, "共 " + rowsCache.length + " 行 · " + COLS.length + " 列 · 运营反馈已填 " +
          countOpsFilledInCache(rowsCache) + "/" + rowsCache.length + "（" + pre + "）· 已同步", "ok");
        startServerPoll();
      } catch (e) {
        if (myGen !== loadRowsGen) return;
        if (e && e.name === "AbortError") return;
        throw e;
      }
    }

    async function initApp() {
      ensureCfg();
      tableWrap = document.querySelector(".table-wrap");
      if (tableWrap && !tableWrap._virtualScrollBound) {
        tableWrap._virtualScrollBound = true;
        tableWrap.addEventListener("scroll", function () {
          if (multiEditDragAnchor || multiEditSelectDragging) {
            cancelMultiEditDrag(true);
          }
          if (displayRowList().length <= VIRTUAL_THRESHOLD) return;
          if (virtualScrollRaf) return;
          virtualScrollRaf = requestAnimationFrame(function () {
            virtualScrollRaf = null;
            renderBody({ virtualOnly: true });
          });
        }, { passive: true });
      }
      await loadPrefixes();
      await loadRows();
      var replayed = await replayKeepaliveFailures();
      if (replayed > 0) {
        setStatus(appStatus, "已补传 " + replayed + " 条离线未保存到云端", "ok");
        await loadRows();
      }
    }

    document.getElementById("btnGate").addEventListener("click", enterApp);
    gatePwd.addEventListener("keydown", function (ev) {
      if (ev.key === "Enter") enterApp();
    });
    document.getElementById("btnReload").addEventListener("click", function () {
      loadRows().catch(function (e) { setStatus(appStatus, e.message || String(e), "err"); });
    });
    if (btnClearCloud) {
      btnClearCloud.addEventListener("click", function () {
        clearCloudData().catch(function (e) { setStatus(appStatus, e.message || String(e), "err"); });
      });
    }
    document.getElementById("btnLogout").addEventListener("click", logout);
    bindPrefix.addEventListener("change", function () {
      closeColFilterPop();
      flushAllPendingSavesAsync()
        .then(function () { return loadRows(); })
        .catch(function (e) { setStatus(appStatus, e.message || String(e), "err"); });
    });
    searchBox.addEventListener("input", function () {
      if (searchRenderTimer) clearTimeout(searchRenderTimer);
      searchRenderTimer = setTimeout(function () {
        searchRenderTimer = null;
        renderBody();
      }, 200);
    });
    if (btnClearFilters) {
      btnClearFilters.addEventListener("click", function () {
        clearColFilter(null);
      });
    }
    if (btnFilterAll) {
      btnFilterAll.addEventListener("click", function () {
        if (!colFilterList) return;
        var visibles = [];
        colFilterList.querySelectorAll(".col-filter-item").forEach(function (lab) {
          if (lab.hidden) return;
          var cb = lab.querySelector("input[type=checkbox]");
          if (cb) visibles.push(cb);
        });
        var allChecked = visibles.length > 0 && visibles.every(function (cb) { return cb.checked; });
        visibles.forEach(function (cb) { cb.checked = !allChecked; });
        syncFilterAllBtnLabel();
      });
    }
    if (colFilterSearch) {
      colFilterSearch.addEventListener("input", filterColFilterListBySearch);
      colFilterSearch.addEventListener("keydown", function (ev) {
        if (ev.key === "Enter") {
          ev.preventDefault();
          applyColFilterDraft();
        }
        if (ev.key === "Escape") closeColFilterPop();
      });
    }
    if (btnFilterOk) btnFilterOk.addEventListener("click", applyColFilterDraft);
    if (btnFilterCancel) btnFilterCancel.addEventListener("click", closeColFilterPop);
    if (btnClearColFilter) {
      btnClearColFilter.addEventListener("click", function () {
        if (filterPopCol) clearColFilter(filterPopCol);
      });
    }
    document.addEventListener("mousedown", function (ev) {
      if (!colFilterPop || colFilterPop.hidden) return;
      if (colFilterPop.contains(ev.target)) return;
      if (ev.target.closest && ev.target.closest(".col-filter-btn")) return;
      closeColFilterPop();
    });
    document.addEventListener("keydown", function (ev) {
      if (ev.key === "Escape" && colFilterPop && !colFilterPop.hidden) closeColFilterPop();
    });
    window.addEventListener("resize", function () {
      if (filterPopAnchor && filterPopCol) positionColFilterPop(filterPopAnchor);
    });

    document.addEventListener("paste", function (ev) {
      if (!app || app.classList.contains("hidden")) return;
      var col = activeMultiEditColForBatch();
      if (!col || !shouldBatchPasteMultiEdit(col)) return;
      var ae = document.activeElement;
      if (ae && (ae.tagName === "INPUT" || ae.tagName === "TEXTAREA" || ae.isContentEditable)) {
        if (!ae.classList || !ae.classList.contains("multi-edit-input")) return;
      }
      var text = ev.clipboardData && ev.clipboardData.getData("text/plain");
      if (text == null) return;
      ev.preventDefault();
      ev.stopPropagation();
      applyMultiEditPasteFromText(col, text);
    }, true);

    document.addEventListener("keydown", function (ev) {
      if (!app || app.classList.contains("hidden")) return;
      if ((ev.ctrlKey || ev.metaKey) && !ev.altKey && (ev.key === "c" || ev.key === "C")) {
        var aeCopy = document.activeElement;
        if (aeCopy && (aeCopy.tagName === "INPUT" || aeCopy.tagName === "TEXTAREA") &&
            aeCopy.selectionStart !== aeCopy.selectionEnd) {
          return;
        }
        var copyCol = activeMultiEditColForBatch();
        if (copyCol && multiEditSelKeys(copyCol).length) {
          ev.preventDefault();
          copyTextToClipboard(multiEditCopyText(copyCol),
            multiEditSelKeys(copyCol).length > 1 ? "已复制 " + multiEditSelKeys(copyCol).length + " 格" : "已复制");
          return;
        }
      }
      if (ev.key === "Escape") {
        var escCol = activeMultiEditColForBatch();
        if (escCol && multiEditSelKeys(escCol).length > 1) {
          var cfg = multiEditCfg(escCol);
          var keepKey = (multiEditSel[escCol] && multiEditSel[escCol].activeKey) || multiEditSelKeys(escCol)[0];
          syncMultiEditSingleCell(escCol, keepKey);
          setStatus(appStatus, "已释放" + (cfg ? cfg.label : escCol) + "多选", "ok");
          ev.preventDefault();
          return;
        }
      }
      if (ev.key !== "Delete" && ev.key !== "Backspace") return;
      if (ev.ctrlKey || ev.metaKey || ev.altKey) return;
      var delCol = activeMultiEditColForBatch();
      var delKeys = delCol ? multiEditSelKeys(delCol) : [];
      if (!delCol || !delKeys.length) return;
      var ae = document.activeElement;
      var inEdit = ae && (ae.tagName === "INPUT" || ae.tagName === "TEXTAREA" || ae.isContentEditable);
      if (inEdit && delKeys.length === 1) return;
      if (inEdit && ae && ae.blur) ae.blur();
      ev.preventDefault();
      deleteMultiEditSelectionValues(delCol);
    });

    if (btnCopyFormula) {
      btnCopyFormula.addEventListener("click", function () {
        var copyCol = activeMultiEditColForBatch();
        if (copyCol && multiEditSelKeys(copyCol).length > 1) {
          copyTextToClipboard(multiEditCopyText(copyCol), "已复制 " + multiEditSelKeys(copyCol).length + " 格");
          return;
        }
        var text = cellFormula && cellFormula.value ? cellFormula.value : "";
        copyTextToClipboard(text, "已复制编辑栏内容");
      });
    }

    var role = readSessionRole();
    if (role) {
      sessionRole = role;
      syncRoleUi();
      showApp(true);
      initApp().catch(function (e) {
        logout();
        setStatus(gateStatus, e.message || String(e), "err");
      });
    }

    window.addEventListener("beforeunload", function (ev) {
      captureLiveEditsToPending();
      if (countUnsavedCells() > 0) {
        flushAllPendingSavesKeepalive();
        ev.preventDefault();
        ev.returnValue = "";
      }
    });
    window.addEventListener("pagehide", function (ev) {
      if (!ev.persisted && countUnsavedCells() > 0) flushAllPendingSavesKeepalive();
    });
    document.addEventListener("visibilitychange", function () {
      if (document.visibilityState === "hidden") {
        tabHiddenAt = Date.now();
        if (countUnsavedCells() > 0) flushAllPendingSavesKeepalive();
        return;
      }
      if (document.visibilityState !== "visible") return;
      tabHiddenAt = 0;
      if (!bindPrefix.value) return;
      silentRefreshFromServer();
    });
  })();
  </script>
</body>
</html>
