<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <title>表11 协作反馈</title>
  <style>
    :root { --bg:#f4f5f7; --card:#fff; --line:#dfe3e8; --accent:#6b4ce6; --text:#1f2937; }
    * { box-sizing: border-box; }
    body { margin:0; font:14px/1.45 "Microsoft YaHei UI", sans-serif; background:var(--bg); color:var(--text); }
    .wrap { max-width: 100%; padding: 16px 20px 32px; }
    h1 { margin:0 0 8px; font-size:20px; }
    .sub { color:#64748b; margin-bottom:16px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:16px; }
    .gate { max-width:420px; margin:80px auto; }
    .row { display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom:12px; }
    label { font-weight:600; }
    input, select, button { font:inherit; padding:8px 10px; border:1px solid var(--line); border-radius:8px; }
    input[type=text], input[type=password] { min-width:220px; }
    button { cursor:pointer; background:#fff; }
    button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
    button.danger { color:#dc2626; border-color:#fecaca; }
    button.danger:hover { background:#fef2f2; }
    .role-tag { font-size:12px; font-weight:600; color:#64748b; padding:2px 8px; border-radius:6px; background:#f1f5f9; }
    .role-tag.admin { color:#b45309; background:#fffbeb; }
    .status { min-height:22px; color:#64748b; }
    .status.err { color:#dc2626; }
    .status.ok { color:#059669; }
    .formula-bar {
      display:flex; align-items:stretch; flex-shrink:0;
      background:#fff; border:1px solid var(--line); border-radius:8px;
      margin-bottom:10px; min-height:28px; overflow:hidden;
    }
    .formula-addr {
      flex:0 0 200px; max-width:280px; padding:0 8px;
      display:flex; align-items:center; border-right:1px solid var(--line);
      background:#f8fafc; color:#64748b; white-space:nowrap;
      overflow:hidden; text-overflow:ellipsis; font-size:11px; user-select:none;
    }
    .formula-input-wrap { flex:1; min-width:0; display:flex; align-items:center; }
    #cellFormula {
      width:100%; min-height:28px; max-height:120px; border:0; padding:4px 8px;
      font:inherit; resize:none; overflow:auto; background:#fff; outline:none;
      line-height:1.35; white-space:pre-wrap; word-break:break-all;
    }
    #cellFormula:focus { box-shadow:inset 0 0 0 1px rgba(107,76,230,0.45); }
    .formula-copy {
      flex-shrink:0; border:0; border-left:1px solid var(--line); border-radius:0;
      padding:0 12px; background:#f8fafc; color:#475569; cursor:pointer;
    }
    .formula-copy:hover { background:#eef2ff; color:var(--accent); }
    .formula-copy:disabled { opacity:.45; cursor:not-allowed; }
    .table-wrap { overflow:auto; border:1px solid var(--line); border-radius:8px; background:#fff; max-height: calc(100vh - 280px); }
    table { border-collapse:collapse; table-layout:fixed; }
    th, td {
      border-bottom:1px solid #eef1f4; padding:6px 8px; vertical-align:middle;
      overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
      box-sizing:border-box;
    }
    th { position:sticky; top:0; background:#f8fafc; z-index:2; text-align:left; font-size:12px; }
    th .th-inner { display:flex; align-items:center; gap:2px; min-width:0; padding-right:8px; }
    th .th-label { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; cursor:pointer; user-select:none; }
    th .th-label:hover { color:var(--accent); }
    th .th-label.sorted { color:var(--accent); font-weight:600; }
    th .sort-ind { flex-shrink:0; font-size:10px; color:var(--accent); width:12px; text-align:center; }
    th .col-filter-btn {
      flex-shrink:0; border:0; background:transparent; padding:0 2px; cursor:pointer;
      font-size:11px; line-height:1; color:#94a3b8; border-radius:4px;
    }
    th .col-filter-btn:hover { color:var(--accent); background:#eef2ff; }
    th .col-filter-btn.active { color:var(--accent); font-weight:700; }
    th .col-resize { position:absolute; top:0; right:0; width:7px; height:100%; cursor:col-resize; z-index:3; touch-action:none; }
    th .col-resize::after { content:""; position:absolute; top:20%; bottom:20%; right:2px; width:2px; border-radius:1px; background:transparent; transition:background .15s; }
    th .col-resize:hover::after, body.col-resizing th .col-resize::after { background:#94a3b8; }
    body.col-resizing { cursor:col-resize !important; user-select:none !important; }
    body.col-resizing * { cursor:col-resize !important; }
    td.cell-selected { box-shadow:inset 0 0 0 1px #ea580c; background:#fff !important; }
    td.editable input {
      display:block; width:100%; min-width:0; max-width:100%;
      border:0; background:transparent; padding:0; margin:0;
      font:inherit; color:inherit; outline:none;
      overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    }
    td.editable input:focus { background:rgba(255,255,255,0.6); }
    tr:hover td { background:#fafbff; }
    tr:hover td.cell-selected { background:#f5f3ff !important; }
    .hidden { display:none !important; }
    .col-filter-pop {
      position:fixed; z-index:1000; width:min(420px, calc(100vw - 16px));
      max-height:min(520px, calc(100vh - 16px)); background:#fff; border:1px solid var(--line);
      border-radius:10px; box-shadow:0 8px 32px rgba(15,23,42,0.14); display:flex; flex-direction:column;
    }
    .col-filter-pop[hidden] { display:none !important; }
    .col-filter-head {
      display:flex; align-items:center; justify-content:space-between; gap:8px;
      padding:10px 12px; border-bottom:1px solid var(--line); font-size:13px;
    }
    .col-filter-tools { display:flex; gap:6px; flex-wrap:wrap; padding:8px 12px; border-bottom:1px solid #eef1f4; }
    .col-filter-tools input[type=search] { flex:1; min-width:120px; }
    .col-filter-list { overflow:auto; padding:6px 0; max-height:360px; }
    .col-filter-item {
      display:flex; align-items:center; gap:8px; padding:4px 12px; cursor:pointer; font-size:13px;
    }
    .col-filter-item:hover { background:#f8fafc; }
    .col-filter-item .cnt { margin-left:auto; color:#94a3b8; font-size:12px; }
    .col-filter-foot {
      display:flex; justify-content:flex-end; gap:8px; padding:10px 12px; border-top:1px solid var(--line);
    }
    .filter-clear-link { margin-left:auto; font-size:12px; color:#64748b; cursor:pointer; text-decoration:underline; }
    td.relate-po-sel-inactive input.relate-po-input {
      background: #f1f5f9 !important;
    }
    td.multi-edit-sel-inactive { background: rgba(0,0,0,0.06) !important; }
    td.multi-edit-sel-inactive input.multi-edit-input { background: transparent !important; }
    td.multi-edit-sel-active { background: #fff !important; }
    td.multi-edit-sel-active input.multi-edit-input { background: transparent !important; }
    td.multi-edit-sel-top { box-shadow: inset 0 1px 0 0 #ea580c, inset 1px 0 0 0 #ea580c, inset -1px 0 0 0 #ea580c; }
    td.multi-edit-sel-btm { box-shadow: inset 0 -1px 0 0 #ea580c, inset 1px 0 0 0 #ea580c, inset -1px 0 0 0 #ea580c; }
    td.multi-edit-sel-mid { box-shadow: inset 1px 0 0 0 #ea580c, inset -1px 0 0 0 #ea580c; }
    td.multi-edit-sel-single { box-shadow: inset 0 0 0 1px #ea580c; }
    tr.virtual-spacer td { padding: 0 !important; border: none !important; background: transparent !important; }
    td.multi-edit-cell input.multi-edit-input {
      display:block; width:100%; min-width:0; border:0; background:transparent;
      padding:0; margin:0; font:inherit; outline:none;
      overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    }
    td.multi-edit-cell input.multi-edit-input:focus { background:rgba(255,255,255,0.6); }
    td.editable input.save-failed,
    td.multi-edit-cell input.save-failed {
      background: #fef2f2 !important;
      box-shadow: inset 0 0 0 1px #dc2626;
    }
    td.editable input.save-pending,
    td.multi-edit-cell input.save-pending {
      background: #fffbeb !important;
    }
    body.multi-edit-selecting { user-select:none; cursor:default; }
  </style>
</head>
<body>
  <div id="gate" class="wrap gate card">
    <h1>表11 协作反馈</h1>
    <p class="sub">请输入站点密码：运营可编辑协作列；管理员可清除云端数据</p>
    <div class="row">
      <input type="password" id="gatePwd" placeholder="站点密码" />
      <button type="button" class="primary" id="btnGate">进入</button>
    </div>
    <div id="gateStatus" class="status"></div>
  </div>

  <div id="app" class="wrap hidden">
    <div class="card">
      <h1>表11 协作反馈</h1>
      <p class="sub">列与表11 推送一致；点列名排序 · ▾ 筛选；运营反馈以<strong>云端为准</strong>，只提交你改过的格（同步版 9/9-r6）。到仓时间 / 运营反馈 / 运营确认SKU / 替换SKU 可 Ctrl、Shift、拖选后粘贴或 Delete</p>
      <div class="row">
        <label>绑定平台
          <select id="bindPrefix"></select>
        </label>
        <input type="text" id="searchBox" placeholder="搜索全部列（含店长、店铺、订单编号等）" />
        <button type="button" id="btnClearFilters" title="清除列筛选、搜索，恢复默认排序">清除筛选</button>
        <button type="button" class="primary" id="btnReload">刷新</button>
        <button type="button" id="btnClearCloud" class="danger hidden" title="删除当前绑定平台在 Supabase 中的全部协作行">清除本平台云端</button>
        <span id="roleTag" class="role-tag hidden"></span>
        <button type="button" id="btnLogout">退出</button>
      </div>
      <div id="appStatus" class="status"></div>
    </div>
    <div class="formula-bar" title="类似 Excel 编辑栏，单击单元格查看完整内容">
      <div class="formula-addr" id="cellAddr">—</div>
      <div class="formula-input-wrap">
        <textarea id="cellFormula" readonly rows="1" placeholder="点击单元格查看完整内容…"></textarea>
      </div>
      <button type="button" id="btnCopyFormula" class="formula-copy" title="复制编辑栏内容" disabled>复制</button>
    </div>
    <div class="table-wrap">
      <table>
        <colgroup id="colgroup"></colgroup>
        <thead id="thead"></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>

  <div id="colFilterPop" class="col-filter-pop" hidden>
    <div class="col-filter-head">
      <strong id="colFilterTitle">列筛选</strong>
      <span id="btnClearColFilter" class="filter-clear-link">清除本列</span>
    </div>
    <div class="col-filter-tools">
      <input type="search" id="colFilterSearch" placeholder="搜索本列取值…" autocomplete="off" />
      <button type="button" id="btnFilterAll">全选</button>
    </div>
    <div id="colFilterList" class="col-filter-list"></div>
    <div class="col-filter-foot">
      <button type="button" id="btnFilterCancel">取消</button>
      <button type="button" class="primary" id="btnFilterOk">确定</button>
    </div>
  </div>

  <script src="config.js?v=20260909r6"></script>
  <script>
  (function () {
    "use strict";

    var SESSION_KEY = "t11_portal_session_v2";
    var SESSION_LEGACY = "t11_portal_session_v1";
    var COL_ETA = "反馈（到仓时间）";
    var COL_OPS = "运营反馈";
    var CONFIRM_COL = "运营确认SKU";
    var COL_REPLACE = "替换SKU";
    var FALLBACK_COLS = [
      "下单时间", "下单时间（改）", "入库时间", "订单编号", "产品ID", "SKU（改）", "数量（改）",
      "品名", "订单规格", "缺货规格",
      "店铺", "店长", "采购员",
      "缺货原因", "运单号", "采购单号（准）", "采购状态", "采购添加时间",
      "物流单号", "最新物流信息", "扫描时间", "收货时间", "上架时间",
      COL_ETA, COL_OPS, CONFIRM_COL, COL_REPLACE
    ];
    var COLS = [];
    var EDIT_COLS = {
      "反馈（到仓时间）": "eta"
    };
    EDIT_COLS[COL_REPLACE] = "snap:" + COL_REPLACE;
    var MULTI_EDIT_COLS = Object.create(null);
    MULTI_EDIT_COLS[COL_ETA] = { field: "eta", label: COL_ETA };
    MULTI_EDIT_COLS[COL_OPS] = { field: "ops", label: COL_OPS };
    MULTI_EDIT_COLS[CONFIRM_COL] = { field: "confirm_sku", label: CONFIRM_COL };
    MULTI_EDIT_COLS[COL_REPLACE] = { field: "snap:" + COL_REPLACE, label: COL_REPLACE };
    var WIDTH_STORE_KEY = "t11_portal_col_widths_v1";
    var FILTER_STORE_KEY = "t11_portal_col_filters_v1";
    var SORT_STORE_KEY = "t11_portal_col_sort_v1";
    var DEFAULT_SORT_COL = "下单时间";
    var DEFAULT_SORT_FALLBACK = "下单时间（改）";
    var DATE_COLS = {
      "下单时间": 1, "下单时间（改）": 1, "入库时间": 1, "采购添加时间": 1,
      "收货时间": 1, "上架时间": 1
    };
    var NUM_COLS = { "数量（改）": 1, "产品ID": 1 };
    var DEFAULT_WIDTH_BY_COL = {
      "下单时间（改）": 88, "入库时间": 88, "产品ID": 72, "SKU（改）": 140, "数量（改）": 52,
      "订单编号": 120, "品名": 160, "订单规格": 120, "缺货规格": 120,
      "反馈（到仓时间）": 120, "运营反馈": 140, "运营确认SKU": 140, "替换SKU": 140, "采购单号（准）": 110, "采购添加时间": 140,
      "最新物流信息": 180, "物流单号": 120
    };
    var colWidths = Object.create(null);
    var resizeState = null;
    var selectedCell = null;

    var cellAddr = document.getElementById("cellAddr");
    var cellFormula = document.getElementById("cellFormula");
    var btnCopyFormula = document.getElementById("btnCopyFormula");

    var cfg = window.T11PortalConfig || {};
    var supabaseUrl = String(cfg.supabaseUrl || "").replace(/\/+$/, "");
    var anonKey = String(cfg.supabaseAnonKey || "");
    var editPassword = String(cfg.editPassword || cfg.sitePassword || "");
    var adminPassword = String(cfg.adminPassword || "");
    var legacyPasswords = [];
    if (cfg.sitePassword && String(cfg.sitePassword) !== editPassword) {
      legacyPasswords.push(String(cfg.sitePassword));
    }
    (cfg.legacyPasswords || []).forEach(function (p) {
      p = String(p == null ? "" : p).trim();
      if (p && legacyPasswords.indexOf(p) < 0) legacyPasswords.push(p);
    });
    var sessionRole = "";

    var gate = document.getElementById("gate");
    var app = document.getElementById("app");
    var gatePwd = document.getElementById("gatePwd");
    var gateStatus = document.getElementById("gateStatus");
    var bindPrefix = document.getElementById("bindPrefix");
    var searchBox = document.getElementById("searchBox");
    var appStatus = document.getElementById("appStatus");
    var roleTag = document.getElementById("roleTag");
    var btnClearCloud = document.getElementById("btnClearCloud");
    var thead = document.getElementById("thead");
    var colgroup = document.getElementById("colgroup");
    var tbody = document.getElementById("tbody");
    var fillLogBody = document.getElementById("fillLogBody");
    var fillLogStatus = document.getElementById("fillLogStatus");
    var fillLogsCache = [];
    var rowsCache = [];
    /** 仅用户真正改过、且与云端不一致的格。rowsCache 始终是最近一次云端快照。 */
    var drafts = Object.create(null);
    var colFilters = Object.create(null);
    var sortState = null;
    var filterPopCol = null;
    var filterDraft = null;
    var filterPopAnchor = null;
    var multiEditSel = Object.create(null);
    var multiEditDragAnchor = null;
    var multiEditSelectDragging = false;
    var multiEditJustDragged = false;
    var multiEditDragCol = "";
    var multiEditCtrlDragBase = null;
    var displayRowsCache = null;
    var displayRowsCacheToken = "";
    var rowKeyIndexMap = Object.create(null);
    var saveTimers = Object.create(null);
    var saveRetryTimers = Object.create(null);
    var pendingSaves = Object.create(null);
    var SAVE_RETRY_MAX = 5;
    var SAVE_DEBOUNCE_MS = 400;
    var KEEPALIVE_FAIL_KEY = "t11_portal_keepalive_fail_v1";
    var multiEditPaintRaf = null;
    var virtualScrollRaf = null;
    var formulaBarRaf = null;
    var searchRenderTimer = null;
    var VIRTUAL_ROW_H = 30;
    var VIRTUAL_THRESHOLD = 250;
    var tableWrap = null;
    var loadRowsGen = 0;
    var loadRowsAbort = null;
    var tabHiddenAt = 0;
    var AUTO_RELOAD_HIDDEN_MS = 0;
    var POLL_MS = 5000;
    var pollTimer = null;
    var lastServerSyncAt = 0;

    var colFilterPop = document.getElementById("colFilterPop");
    var colFilterTitle = document.getElementById("colFilterTitle");
    var colFilterList = document.getElementById("colFilterList");
    var colFilterSearch = document.getElementById("colFilterSearch");
    var btnFilterAll = document.getElementById("btnFilterAll");
    var btnFilterOk = document.getElementById("btnFilterOk");
    var btnFilterCancel = document.getElementById("btnFilterCancel");
    var btnClearColFilter = document.getElementById("btnClearColFilter");
    var btnClearFilters = document.getElementById("btnClearFilters");

    function setStatus(el, text, kind) {
      el.textContent = text || "";
      el.className = "status" + (kind ? " " + kind : "");
    }

    function ensureCfg() {
      if (!supabaseUrl || !anonKey) throw new Error("缺少 Supabase 配置，请先运行 scripts/setup_supabase_t11.mjs");
      if (!editPassword && !adminPassword) throw new Error("缺少站点密码配置");
    }

    function normalizePasswordInput(pwd) {
      pwd = String(pwd == null ? "" : pwd).trim();
      return pwd.replace(/[\uFF10-\uFF19]/g, function (ch) {
        return String.fromCharCode(ch.charCodeAt(0) - 0xFF10 + 48);
      });
    }

    function resolveRoleFromPassword(pwd) {
      pwd = normalizePasswordInput(pwd);
      if (!pwd) return "";
      if (adminPassword && pwd === normalizePasswordInput(adminPassword)) return "admin";
      if (editPassword && pwd === normalizePasswordInput(editPassword)) return "edit";
      for (var i = 0; i < legacyPasswords.length; i++) {
        if (pwd === normalizePasswordInput(legacyPasswords[i])) return "edit";
      }
      return "";
    }

    function saveSession(role) {
      sessionRole = role || "";
      try {
        sessionStorage.setItem(SESSION_KEY, JSON.stringify({ role: sessionRole }));
      } catch (_) {}
      syncRoleUi();
    }

    function syncRoleUi() {
      var isAdmin = sessionRole === "admin";
      if (roleTag) {
        roleTag.classList.remove("hidden");
        roleTag.textContent = isAdmin ? "管理员" : "运营";
        roleTag.classList.toggle("admin", isAdmin);
      }
      if (btnClearCloud) btnClearCloud.classList.toggle("hidden", !isAdmin);
    }

    function readSessionRole() {
      try {
        var raw = sessionStorage.getItem(SESSION_KEY);
        if (raw) {
          var parsed = JSON.parse(raw);
          if (parsed && (parsed.role === "admin" || parsed.role === "edit")) return parsed.role;
        }
        if (sessionStorage.getItem(SESSION_LEGACY) === "1") return "edit";
      } catch (_) {}
      return "";
    }

    function hdr(extra) {
      var h = {
        apikey: anonKey,
        Authorization: "Bearer " + anonKey,
        "Content-Type": "application/json",
        "Cache-Control": "no-cache"
      };
      if (extra) Object.keys(extra).forEach(function (k) { h[k] = extra[k]; });
      return h;
    }

    async function sbFetch(path, opts) {
      opts = opts || {};
      var extraHdr = Object.create(null);
      if (opts.prefer) extraHdr.Prefer = opts.prefer;
      if (opts.range) extraHdr.Range = opts.range;
      var ctrl = new AbortController();
      var timer = setTimeout(function () { ctrl.abort(); }, 30000);
      var res;
      try {
        res = await fetch(supabaseUrl + path, {
          method: opts.method || "GET",
          headers: hdr(Object.keys(extraHdr).length ? extraHdr : null),
          body: opts.body != null ? JSON.stringify(opts.body) : undefined,
          signal: opts.signal || ctrl.signal,
          cache: "no-store"
        });
      } catch (e) {
        if (e && e.name === "AbortError") {
          throw new Error("请求超时（30s）");
        }
        throw e;
      } finally {
        clearTimeout(timer);
      }
      var text = await res.text();
      if (!res.ok) {
        var msg = text;
        try { msg = JSON.parse(text).message || text; } catch (_) {}
        throw new Error(msg);
      }
      var parsed = null;
      if (text) {
        try { parsed = JSON.parse(text); } catch (_) { parsed = text; }
      }
      if (opts.returnMeta) {
        return { data: parsed, contentRange: res.headers.get("Content-Range") || "" };
      }
      return parsed;
    }

    function parseContentRangeTotal(contentRange) {
      var cr = String(contentRange || "");
      var m = cr.match(/\/(\d+|\*)\s*$/);
      if (!m || m[1] === "*") return null;
      var n = parseInt(m[1], 10);
      return isFinite(n) ? n : null;
    }

    function showApp(on) {
      gate.classList.toggle("hidden", on);
      app.classList.toggle("hidden", !on);
    }

    function enterApp() {
      ensureCfg();
      var role = resolveRoleFromPassword(gatePwd.value);
      if (!role) {
        setStatus(gateStatus, "密码错误", "err");
        return;
      }
      saveSession(role);
      showApp(true);
      initApp().catch(function (e) {
        setStatus(appStatus, e.message || String(e), "err");
      });
    }

    function logout() {
      sessionRole = "";
      try {
        sessionStorage.removeItem(SESSION_KEY);
        sessionStorage.removeItem(SESSION_LEGACY);
      } catch (_) {}
      showApp(false);
      gatePwd.value = "";
      if (roleTag) roleTag.classList.add("hidden");
      if (btnClearCloud) btnClearCloud.classList.add("hidden");
    }

    function isSnapshotField(field) {
      return String(field || "").indexOf("snap:") === 0;
    }

    function snapshotFieldKey(field) {
      return String(field || "").slice(5);
    }

    function snapshotFieldValue(rec, field) {
      if (!rec || !isSnapshotField(field)) return "";
      var snap = rec.snapshot && typeof rec.snapshot === "object" ? rec.snapshot : {};
      var key = snapshotFieldKey(field);
      return snap[key] != null ? String(snap[key]) : "";
    }

    function fieldToFillCol(field) {
      if (field === "ops") return COL_OPS;
      if (field === "confirm_sku") return CONFIRM_COL;
      return "";
    }

    function fillSourceLabel(source) {
      if (source === "board_push") return "看板推送";
      return "协作页";
    }

    function formatFillTime(iso) {
      if (!iso) return "";
      try {
        return new Date(iso).toLocaleString("zh-CN", { hour12: false, timeZone: "Asia/Shanghai" });
      } catch (_) {
        return String(iso);
      }
    }

    function currentCellForLog(rec, col) {
      if (!rec) return "";
      return String(snapVal(rec, col) || "");
    }

    function draftKey(rowKey, field) {
      return String(rowKey || "") + "\u0001" + String(field || "");
    }

    function findRowByKey(rowKey) {
      if (!rowKey) return null;
      for (var i = 0; i < rowsCache.length; i++) {
        if (rowsCache[i].row_key === rowKey) return rowsCache[i];
      }
      return null;
    }

    function getServerField(rec, field) {
      if (!rec || !field) return "";
      if (field === "ops") {
        var ops = rec.ops != null ? String(rec.ops) : "";
        if (String(ops).trim()) return ops;
        var snapOps = rec.snapshot && typeof rec.snapshot === "object" ? rec.snapshot : {};
        return snapOps[COL_OPS] != null ? String(snapOps[COL_OPS]) : ops;
      }
      if (field === "eta") return rec.eta != null ? String(rec.eta) : "";
      if (field === "confirm_sku") {
        var confirm = rec.confirm_sku != null ? String(rec.confirm_sku) : "";
        if (String(confirm).trim()) return confirm;
        var snapConfirm = rec.snapshot && typeof rec.snapshot === "object" ? rec.snapshot : {};
        return snapConfirm[CONFIRM_COL] != null ? String(snapConfirm[CONFIRM_COL]) : confirm;
      }
      if (isSnapshotField(field)) return snapshotFieldValue(rec, field);
      return rec[field] != null ? String(rec[field]) : "";
    }

    function getDisplayField(rec, field) {
      if (!rec) return "";
      var job = drafts[draftKey(rec.row_key, field)];
      if (job) return job.value == null ? "" : String(job.value);
      return getServerField(rec, field);
    }

    function isDraft(rowKey, field) {
      return !!(rowKey && field && drafts[draftKey(rowKey, field)]);
    }

    function setDraft(rowKey, field, value) {
      if (!rowKey || !field) return;
      value = value == null ? "" : String(value);
      var rec = findRowByKey(rowKey);
      var serverVal = getServerField(rec, field);
      var k = draftKey(rowKey, field);
      if (value === serverVal) {
        if (drafts[k] && drafts[k].status === "failed") {
          drafts[k].value = value;
          return;
        }
        delete drafts[k];
        return;
      }
      var prev = drafts[k];
      drafts[k] = {
        rowKey: rowKey,
        field: field,
        value: value,
        status: prev && prev.status === "failed" ? "failed" : "editing"
      };
    }

    function clearDraft(rowKey, field) {
      delete drafts[draftKey(rowKey, field)];
    }

    function pruneDraftsAgainstRows(list) {
      var byKey = Object.create(null);
      (list || []).forEach(function (r) {
        if (r && r.row_key) byKey[r.row_key] = r;
      });
      Object.keys(drafts).forEach(function (k) {
        var d = drafts[k];
        if (!d) return;
        var rec = byKey[d.rowKey];
        if (!rec) return;
        if (getServerField(rec, d.field) === String(d.value == null ? "" : d.value)) {
          delete drafts[k];
        }
      });
    }

    function findRowByKeyOrOrderSku(rowKey, orderNo, sku) {
      var i;
      for (i = 0; i < rowsCache.length; i++) {
        if (rowsCache[i].row_key === rowKey) return rowsCache[i];
      }
      orderNo = String(orderNo || "").trim();
      sku = String(sku || "").trim();
      if (!orderNo || !sku) return null;
      for (i = 0; i < rowsCache.length; i++) {
        if (String(rowsCache[i].order_no || "").trim() === orderNo &&
            String(rowsCache[i].sku || "").trim() === sku) {
          return rowsCache[i];
        }
      }
      return null;
    }

    function fillLogSyncState(log) {
      var rec = findRowByKeyOrOrderSku(log.row_key, log.order_no, log.sku);
      if (!rec) {
        return { ok: false, text: "库无此行" };
      }
      var now = currentCellForLog(rec, log.col);
      var want = log.new_value != null ? String(log.new_value) : "";
      if (now === want) return { ok: true, text: "已同步" };
      return { ok: false, text: "未同步（现=" + (now || "空") + "）" };
    }

    function renderFillLogs() {
      if (!fillLogBody) return;
      fillLogBody.innerHTML = "";
      if (!fillLogsCache.length) {
        var empty = document.createElement("tr");
        var td = document.createElement("td");
        td.colSpan = 8;
        td.textContent = "暂无填入记录（填「运营反馈 / 运营确认SKU」并保存成功后会出现）";
        empty.appendChild(td);
        fillLogBody.appendChild(empty);
        return;
      }
      fillLogsCache.forEach(function (log) {
        var sync = fillLogSyncState(log);
        var wipe = log.source === "board_push" && !String(log.new_value || "").trim() &&
          String(log.old_value || "").trim();
        var tr = document.createElement("tr");
        var cells = [
          formatFillTime(log.created_at),
          fillSourceLabel(log.source),
          log.order_no || "",
          log.sku || "",
          log.col || "",
          log.old_value || "（空）",
          log.new_value || "（空）",
          sync.text
        ];
        cells.forEach(function (text, idx) {
          var c = document.createElement("td");
          c.textContent = text;
          c.title = text;
          if (idx === 7) c.className = sync.ok ? "fill-log-ok" : "fill-log-bad";
          if (idx === 1 && wipe) c.className = "fill-log-wipe";
          tr.appendChild(c);
        });
        fillLogBody.appendChild(tr);
      });
    }

    function fillLogPrefix(pre) {
      return "__LOG__" + String(pre || "").trim().toUpperCase();
    }

    function mapRowToFillLog(r) {
      var snap = r && r.snapshot && typeof r.snapshot === "object" ? r.snapshot : {};
      return {
        created_at: r.updated_at || snap.created_at || "",
        source: snap.source || "portal",
        row_key: snap.target_row_key || "",
        order_no: r.order_no || snap.order_no || "",
        sku: r.sku || snap.sku || "",
        col: snap.col || "",
        old_value: snap.old_value != null ? String(snap.old_value) : "",
        new_value: snap.new_value != null ? String(snap.new_value) : ""
      };
    }

    async function loadFillLogsFromRowsFallback(pre) {
      var rows = await sbFetch(
        "/rest/v1/t11_rows?bind_prefix=eq." + encodeURIComponent(fillLogPrefix(pre)) +
        "&select=*&order=updated_at.desc&limit=200"
      );
      return (Array.isArray(rows) ? rows : []).map(mapRowToFillLog);
    }

    async function loadFillLogs() {
      /* 填入记录只写 Supabase，协作页不再展示、不再拉取列表。 */
    }

    async function insertFillLogViaRowsFallback(rec, col, oldValue, newValue, source) {
      var pre = rec.bind_prefix || bindPrefix.value || "";
      var key = "__FILLLOG__" + Date.now() + "_" + Math.random().toString(36).slice(2, 10);
      await sbFetch("/rest/v1/t11_rows", {
        method: "POST",
        prefer: "return=minimal",
        body: [{
          row_key: key,
          bind_prefix: fillLogPrefix(pre),
          order_no: rec.order_no || "",
          sku: rec.sku || "",
          snapshot: {
            col: col,
            old_value: oldValue,
            new_value: newValue,
            source: source || "portal",
            target_row_key: rec.row_key || "",
            order_no: rec.order_no || "",
            sku: rec.sku || ""
          },
          eta: "",
          ops: "",
          confirm_sku: "",
          visible: false,
          updated_at: new Date().toISOString()
        }]
      });
    }

    async function insertFillLog(rec, col, oldValue, newValue, source) {
      if (!rec || !col) return;
      oldValue = oldValue == null ? "" : String(oldValue);
      newValue = newValue == null ? "" : String(newValue);
      if (oldValue === newValue) return;
      var payload = {
        bind_prefix: rec.bind_prefix || bindPrefix.value || "",
        row_key: rec.row_key || "",
        order_no: rec.order_no || "",
        sku: rec.sku || "",
        col: col,
        old_value: oldValue,
        new_value: newValue,
        source: source || "portal"
      };
      try {
        await sbFetch("/rest/v1/t11_fill_logs", {
          method: "POST",
          prefer: "return=minimal",
          body: [payload]
        });
      } catch (e) {
        var msg = e && e.message ? String(e.message) : String(e);
        if (/t11_fill_logs|PGRST205|42P01|does not exist/i.test(msg)) {
          try {
            await insertFillLogViaRowsFallback(rec, col, oldValue, newValue, source);
          } catch (e2) {
            setStatus(appStatus, "格子已保存，但填入记录未写入：" + (e2.message || e2), "err");
          }
          return;
        }
        setStatus(appStatus, "格子已保存，但填入记录未写入：" + msg, "err");
      }
    }

    function snapVal(rec, col) {
      if (!rec) return "";
      if (col === COL_ETA) return getDisplayField(rec, "eta");
      if (col === COL_OPS) return getDisplayField(rec, "ops");
      if (col === CONFIRM_COL) return getDisplayField(rec, "confirm_sku");
      if (col === COL_REPLACE) return getDisplayField(rec, "snap:" + COL_REPLACE);
      var snap = rec.snapshot || {};
      return snap[col] != null ? snap[col] : "";
    }

    function invalidateDisplayRowsCache() {
      displayRowsCache = null;
      displayRowsCacheToken = "";
      rowKeyIndexMap = Object.create(null);
    }

    function displayRowsCacheTokenNow() {
      return String(searchBox.value || "") + "\u0001" + JSON.stringify(colFilters) +
        "\u0001" + JSON.stringify(sortState);
    }

    function rebuildRowKeyIndexMap(list) {
      rowKeyIndexMap = Object.create(null);
      (list || []).forEach(function (rec, i) {
        if (rec && rec.row_key) rowKeyIndexMap[rec.row_key] = i;
      });
    }

    function displayRowList(force) {
      var token = displayRowsCacheTokenNow();
      if (!force && displayRowsCache && displayRowsCacheToken === token) return displayRowsCache;
      displayRowsCache = sortedDisplayRowsUncached();
      displayRowsCacheToken = token;
      rebuildRowKeyIndexMap(displayRowsCache);
      return displayRowsCache;
    }

    function rowKeyIndexInDisplay(rowKey) {
      if (rowKeyIndexMap[rowKey] != null) return rowKeyIndexMap[rowKey];
      return rowKeyIndexInDisplaySlow(rowKey);
    }

    function rowKeyIndexInDisplaySlow(rowKey) {
      var list = displayRowList();
      for (var i = 0; i < list.length; i++) {
        if (list[i].row_key === rowKey) return i;
      }
      return -1;
    }

    function isMultiEditCol(col) {
      return !!(col && MULTI_EDIT_COLS[col]);
    }

    function multiEditCfg(col) {
      return MULTI_EDIT_COLS[col] || null;
    }

    function multiEditSelKeys(col) {
      var sel = multiEditSel[col];
      if (!sel || !sel.segments) return [];
      var seen = Object.create(null);
      var all = [];
      sel.segments.forEach(function (seg) {
        (seg.keys || []).forEach(function (k) {
          if (seen[k]) return;
          seen[k] = true;
          all.push(k);
        });
      });
      return all;
    }

    function multiEditMultiActive(col) {
      return multiEditSelKeys(col).length > 1;
    }

    function activeMultiEditColForBatch() {
      var cols = Object.keys(MULTI_EDIT_COLS);
      for (var i = 0; i < cols.length; i++) {
        if (multiEditSelKeys(cols[i]).length) return cols[i];
      }
      if (selectedCell && isMultiEditCol(selectedCell.col)) return selectedCell.col;
      return "";
    }

    function buildMultiEditKeyRange(aKey, bKey) {
      var ia = rowKeyIndexInDisplay(aKey);
      var ib = rowKeyIndexInDisplay(bKey);
      if (ia < 0 || ib < 0) return [aKey, bKey].filter(Boolean);
      var lo = Math.min(ia, ib);
      var hi = Math.max(ia, ib);
      var out = [];
      var list = displayRowList();
      for (var i = lo; i <= hi; i++) out.push(list[i].row_key);
      return out;
    }

    function normalizeMultiEditSegment(anchorKey, keys) {
      keys = (keys || []).filter(Boolean);
      if (!keys.length) return null;
      var seen = Object.create(null);
      var ordered = [];
      keys.forEach(function (k) {
        if (seen[k]) return;
        seen[k] = true;
        ordered.push(k);
      });
      ordered.sort(function (a, b) {
        return rowKeyIndexInDisplay(a) - rowKeyIndexInDisplay(b);
      });
      if (!ordered.length) return null;
      if (ordered.indexOf(anchorKey) < 0) anchorKey = ordered[0];
      return { anchorKey: anchorKey, keys: ordered };
    }

    function findMultiEditTdByRowKey(col, rowKey) {
      if (!tbody || !rowKey || !col) return null;
      var trs = tbody.querySelectorAll("tr[data-key]");
      for (var i = 0; i < trs.length; i++) {
        if (trs[i].dataset.key === rowKey) {
          return trs[i].querySelector('td[data-col="' + col + '"]');
        }
      }
      return null;
    }

    function findMultiEditInputByRowKey(col, rowKey) {
      var td = findMultiEditTdByRowKey(col, rowKey);
      return td ? td.querySelector("input.multi-edit-input") : null;
    }

    function cancelMultiEditDrag(revertRange) {
      detachMultiEditDragListeners();
      var col = multiEditDragCol;
      var anchor = multiEditDragAnchor;
      if (revertRange && multiEditSelectDragging && anchor && anchor.rowKey && col) {
        setMultiEditOneSegment(col, anchor.rowKey, [anchor.rowKey], {
          lastOpAnchorKey: anchor.rowKey
        });
        paintMultiEditCellSelection(col);
      }
      multiEditSelectDragging = false;
      multiEditDragAnchor = null;
      multiEditDragCol = "";
      multiEditCtrlDragBase = null;
      document.body.classList.remove("multi-edit-selecting");
    }

    function clearMultiEditSel(col) {
      if (col) {
        delete multiEditSel[col];
        clearMultiEditSelectionPaint(col);
        return;
      }
      multiEditSel = Object.create(null);
      clearMultiEditSelectionPaint("");
    }

    function clearOtherMultiEditSel(activeCol) {
      Object.keys(MULTI_EDIT_COLS).forEach(function (c) {
        if (c !== activeCol) clearMultiEditSel(c);
      });
    }

    function syncMultiEditSingleCell(col, rowKey) {
      if (!col) return;
      if (!rowKey) {
        clearMultiEditSel(col);
        return;
      }
      setMultiEditOneSegment(col, rowKey, [rowKey], { lastOpAnchorKey: rowKey });
      paintMultiEditCellSelection(col);
    }

    function clearMultiEditSelectionPaint(col) {
      if (!tbody) return;
      var selector = col
        ? 'td[data-col="' + col + '"].multi-edit-sel-inactive, td[data-col="' + col + '"].multi-edit-sel-active, ' +
          'td[data-col="' + col + '"].multi-edit-sel-top, td[data-col="' + col + '"].multi-edit-sel-btm, ' +
          'td[data-col="' + col + '"].multi-edit-sel-mid, td[data-col="' + col + '"].multi-edit-sel-single'
        : "td.multi-edit-sel-inactive, td.multi-edit-sel-active, td.multi-edit-sel-top, td.multi-edit-sel-btm, " +
          "td.multi-edit-sel-mid, td.multi-edit-sel-single";
      tbody.querySelectorAll(selector).forEach(function (td) {
        td.classList.remove(
          "multi-edit-sel-inactive", "multi-edit-sel-active", "multi-edit-sel-top",
          "multi-edit-sel-btm", "multi-edit-sel-mid", "multi-edit-sel-single"
        );
      });
    }

    function paintMultiEditCellSelectionNow(col) {
      if (col) {
        clearMultiEditSelectionPaint(col);
        var sel = multiEditSel[col];
        if (!sel || !sel.segments || !tbody) return;
        sel.segments.forEach(function (seg) {
          var keys = seg.keys || [];
          if (!keys.length) return;
          var minKey = keys[0];
          var maxKey = keys[keys.length - 1];
          keys.forEach(function (key) {
            var td = findMultiEditTdByRowKey(col, key);
            if (!td) return;
            var whiteKey = sel.activeKey || seg.anchorKey;
            if (key === whiteKey) td.classList.add("multi-edit-sel-active");
            else if (keys.length > 1) td.classList.add("multi-edit-sel-inactive");
            if (keys.length === 1) {
              td.classList.add("multi-edit-sel-single");
            } else if (key === minKey && key === maxKey) {
              td.classList.add("multi-edit-sel-single");
            } else if (key === minKey) {
              td.classList.add("multi-edit-sel-top");
            } else if (key === maxKey) {
              td.classList.add("multi-edit-sel-btm");
            } else {
              td.classList.add("multi-edit-sel-mid");
            }
          });
        });
        return;
      }
      Object.keys(MULTI_EDIT_COLS).forEach(function (c) { paintMultiEditCellSelectionNow(c); });
    }

    function paintMultiEditCellSelection(col) {
      if (multiEditPaintRaf) return;
      multiEditPaintRaf = requestAnimationFrame(function () {
        multiEditPaintRaf = null;
        paintMultiEditCellSelectionNow(col || "");
        if (col) updateFormulaBarForMultiEdit(col);
      });
    }

    function cloneMultiEditSel(col) {
      var sel = multiEditSel[col];
      if (!sel || !sel.segments) return null;
      return {
        segments: sel.segments.map(function (seg) {
          return { anchorKey: seg.anchorKey, keys: (seg.keys || []).slice() };
        }),
        shiftAnchorKey: sel.shiftAnchorKey,
        activeKey: sel.activeKey,
        lastOpAnchorKey: sel.lastOpAnchorKey
      };
    }

    function applyCtrlDragRange(col, anchorKey, rangeKeys) {
      var base = multiEditCtrlDragBase;
      if (!base || !base.segments) {
        setMultiEditOneSegment(col, anchorKey, rangeKeys, { lastOpAnchorKey: anchorKey });
        return;
      }
      var baseKeys = [];
      var seen = Object.create(null);
      base.segments.forEach(function (seg) {
        (seg.keys || []).forEach(function (k) {
          if (seen[k]) return;
          seen[k] = true;
          baseKeys.push(k);
        });
      });
      var allIn = rangeKeys.length > 0 && rangeKeys.every(function (k) { return !!seen[k]; });
      var next = Object.create(null);
      baseKeys.forEach(function (k) { next[k] = true; });
      if (allIn) {
        rangeKeys.forEach(function (k) { delete next[k]; });
      } else {
        rangeKeys.forEach(function (k) { next[k] = true; });
      }
      var keys = Object.keys(next);
      if (!keys.length) {
        clearMultiEditSel(col);
        return;
      }
      setMultiEditOneSegment(col, anchorKey, keys, { lastOpAnchorKey: anchorKey });
    }

    function multiEditCopyText(col) {
      var cfg = multiEditCfg(col);
      var keys = multiEditSelKeys(col);
      if (!keys.length && selectedCell && selectedCell.rowKey && selectedCell.col === col) {
        keys = [selectedCell.rowKey];
      }
      return keys.map(function (key) {
        var rec = findRowByKey(key);
        if (!rec || !cfg) return "";
        return getDisplayField(rec, cfg.field);
      }).join("\n");
    }

    function copyTextToClipboard(text, okMsg) {
      text = text == null ? "" : String(text);
      if (!text) {
        setStatus(appStatus, "没有可复制的内容", "warn");
        return;
      }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function () {
          setStatus(appStatus, okMsg || "已复制", "ok");
        }).catch(function () {
          setStatus(appStatus, "复制失败", "err");
        });
      } else {
        setStatus(appStatus, "复制失败", "err");
      }
    }

    function setMultiEditOneSegment(col, anchorKey, keys, opts) {
      opts = opts || {};
      var seg = normalizeMultiEditSegment(anchorKey, keys);
      if (!seg) {
        clearMultiEditSel(col);
        return;
      }
      var opAnchor = opts.lastOpAnchorKey != null ? opts.lastOpAnchorKey : seg.anchorKey;
      multiEditSel[col] = {
        segments: [seg],
        shiftAnchorKey: seg.anchorKey,
        activeKey: opAnchor,
        lastOpAnchorKey: opAnchor
      };
    }

    function setMultiEditDragSegment(col, anchorKey, keys, ctrlAppend) {
      var seg = normalizeMultiEditSegment(anchorKey, keys);
      if (!seg) return;
      if (!multiEditSel[col] || !multiEditSel[col].segments || !ctrlAppend) {
        setMultiEditOneSegment(col, anchorKey, keys, { lastOpAnchorKey: anchorKey });
        return;
      }
      multiEditSel[col].segments.push(seg);
      multiEditSel[col].shiftAnchorKey = anchorKey;
      multiEditSel[col].lastOpAnchorKey = anchorKey;
      multiEditSel[col].activeKey = anchorKey;
    }

    function toggleMultiEditCellSel(col, rowKey) {
      if (!col || !rowKey) return;
      if (!multiEditSel[col] || !multiEditSel[col].segments) {
        setMultiEditOneSegment(col, rowKey, [rowKey], { lastOpAnchorKey: rowKey });
        return;
      }
      var foundSeg = -1;
      var foundIdx = -1;
      multiEditSel[col].segments.forEach(function (seg, si) {
        var idx = (seg.keys || []).indexOf(rowKey);
        if (idx >= 0) {
          foundSeg = si;
          foundIdx = idx;
        }
      });
      if (foundSeg >= 0) {
        var seg = multiEditSel[col].segments[foundSeg];
        seg.keys.splice(foundIdx, 1);
        if (!seg.keys.length) multiEditSel[col].segments.splice(foundSeg, 1);
        if (!multiEditSel[col].segments.length) {
          clearMultiEditSel(col);
          return;
        }
        multiEditSel[col].lastOpAnchorKey = rowKey;
        multiEditSel[col].activeKey = rowKey;
        return;
      }
      multiEditSel[col].segments.push(normalizeMultiEditSegment(rowKey, [rowKey]));
      multiEditSel[col].lastOpAnchorKey = rowKey;
      multiEditSel[col].activeKey = rowKey;
    }

    function extendMultiEditCellSelTo(col, rowKey) {
      if (!col || !rowKey) return;
      var sel = multiEditSel[col];
      var anchor = sel && sel.shiftAnchorKey ? sel.shiftAnchorKey : rowKey;
      var rangeKeys = buildMultiEditKeyRange(anchor, rowKey);
      setMultiEditOneSegment(col, anchor, rangeKeys, { lastOpAnchorKey: anchor });
    }

    function splitClipboardLinesForPaste(text) {
      var raw = String(text == null ? "" : text);
      if (!raw) return [];
      if (raw.charCodeAt(0) === 0xFEFF) raw = raw.slice(1);
      var lines = raw.replace(/\r\n/g, "\n").replace(/\r/g, "\n").split("\n");
      while (lines.length > 1 && !String(lines[lines.length - 1] || "").trim()) lines.pop();
      var multiRow = lines.length > 1;
      return lines.map(function (l) {
        var line = String(l);
        if (multiRow && line.indexOf("\t") >= 0) {
          return String(line.split("\t")[0]).trim();
        }
        return line.trim();
      });
    }

    function shouldBatchPasteMultiEdit(col) {
      if (!col) col = activeMultiEditColForBatch();
      if (!col) return false;
      if (multiEditSelKeys(col).length > 1) return true;
      var ae = document.activeElement;
      if (ae && ae.classList && ae.classList.contains("multi-edit-input") &&
          ae.dataset && ae.dataset.col === col) {
        if (multiEditSelKeys(col).length >= 1) return true;
        return false;
      }
      return multiEditSelKeys(col).length >= 1;
    }

    async function applyMultiEditPasteFromText(col, text) {
      if (!col) return false;
      var cfg = multiEditCfg(col);
      if (!cfg) return false;
      var keys = multiEditSelKeys(col);
      if (!keys.length && selectedCell && selectedCell.col === col && selectedCell.rowKey) {
        keys = [selectedCell.rowKey];
      }
      if (!keys.length) return false;
      var lines = splitClipboardLinesForPaste(text);
      if (!lines.length) {
        setStatus(appStatus, "剪贴板为空", "warn");
        return false;
      }
      var n = lines.length === 1 ? keys.length : Math.min(lines.length, keys.length);
      if (!n) {
        setStatus(appStatus, "没有可粘贴的可编辑单元格", "warn");
        return false;
      }
      var results = await Promise.allSettled(keys.slice(0, n).map(function (key, idx) {
        var val = lines.length === 1 ? lines[0] : String(lines[idx] != null ? lines[idx] : "");
        return saveCell(key, cfg.field, val, { silent: true });
      }));
      var okN = 0;
      var failN = 0;
      results.forEach(function (r, idx) {
        var key = keys[idx];
        var val = lines.length === 1 ? lines[0] : String(lines[idx] != null ? lines[idx] : "");
        var inp = findMultiEditInputByRowKey(col, key);
        if (r.status === "fulfilled") {
          okN++;
          if (inp) {
            inp.value = val;
            markInputSaveState(inp, "saved");
          }
        } else {
          failN++;
          if (inp) markInputSaveState(inp, "failed");
        }
      });
      var extra = "";
      if (lines.length > 1 && lines.length !== keys.length) {
        extra = "（" + lines.length + " 行 → " + n + " 格）";
      }
      if (failN) {
        setStatus(appStatus, "已粘贴 " + n + " 格" + cfg.label + extra + "，" + failN + " 格保存失败请重试", "err");
      } else {
        setStatus(appStatus, "已粘贴并保存 " + okN + " 格" + cfg.label + extra, "ok");
      }
      paintMultiEditCellSelection(col);
      updateFormulaBarForMultiEdit(col);
      return true;
    }

    async function deleteMultiEditSelectionValues(col) {
      if (!col) return false;
      var cfg = multiEditCfg(col);
      if (!cfg) return false;
      var keys = multiEditSelKeys(col);
      if (!keys.length) return false;
      var results = await Promise.allSettled(keys.map(function (key) {
        return saveCell(key, cfg.field, "", { silent: true });
      }));
      var okN = 0;
      var failN = 0;
      results.forEach(function (r, idx) {
        var inp = findMultiEditInputByRowKey(col, keys[idx]);
        if (r.status === "fulfilled") {
          okN++;
          if (inp) {
            inp.value = "";
            markInputSaveState(inp, "saved");
          }
        } else {
          failN++;
          if (inp) markInputSaveState(inp, "failed");
        }
      });
      if (failN) {
        setStatus(appStatus, "已清空 " + okN + " 格" + cfg.label + "，" + failN + " 格失败请重试", "err");
      } else {
        setStatus(appStatus, "已清空 " + okN + " 格" + cfg.label, "ok");
      }
      paintMultiEditCellSelection(col);
      updateFormulaBarForMultiEdit(col);
      return true;
    }

    function multiEditViFromPointer(col, node) {
      if (!node || !node.closest || !col) return null;
      var td = node.closest('td[data-col="' + col + '"]');
      if (!td) return null;
      var tr = td.closest("tr");

    function detachMultiEditDragListeners() {
      document.removeEventListener("mousemove", onMultiEditMouseMove);
      document.removeEventListener("mouseup", onMultiEditMouseUp);
    }

    function onMultiEditMouseMove(ev) {
      var col = multiEditDragCol;
      if (multiEditDragAnchor && !multiEditSelectDragging) {
        var dx = ev.clientX - multiEditDragAnchor.x;
        var dy = ev.clientY - multiEditDragAnchor.y;
        if (dx * dx + dy * dy >= 9) {
          multiEditSelectDragging = true;
          document.body.classList.add("multi-edit-selecting");
        }
      }
      if (!multiEditSelectDragging || !multiEditDragAnchor || !col) return;
      var hitKey = multiEditViFromPointer(col, document.elementFromPoint(ev.clientX, ev.clientY));
      if (hitKey == null) return;
      var anchorKey = multiEditDragAnchor.anchorKey || multiEditDragAnchor.rowKey;
      var sel = multiEditSel[col];
      if (sel && sel.lastOpAnchorKey === hitKey &&
          sel.segments && sel.segments.length === 1 &&
          sel.segments[0].keys && sel.segments[0].keys.length &&
          sel.segments[0].keys[0] === anchorKey &&
          sel.segments[0].keys[sel.segments[0].keys.length - 1] === hitKey) {
        return;
      }
      var rangeKeys = buildMultiEditKeyRange(anchorKey, hitKey);
      if (multiEditDragAnchor.ctrl) applyCtrlDragRange(col, anchorKey, rangeKeys);
      else setMultiEditDragSegment(col, anchorKey, rangeKeys, false);
      paintMultiEditCellSelection(col);
    }

    function onMultiEditMouseUp() {
      var col = multiEditDragCol;
      if (multiEditSelectDragging) {
        multiEditJustDragged = true;
        cancelMultiEditDrag(false);
        if (col) paintMultiEditCellSelection(col);
      } else if (multiEditDragAnchor && multiEditDragAnchor.rowKey && col) {
        var key = multiEditDragAnchor.rowKey;
        var wasCtrl = !!multiEditDragAnchor.ctrl;
        cancelMultiEditDrag(false);
        if (wasCtrl) {
          toggleMultiEditCellSel(col, key);
          paintMultiEditCellSelection(col);
        } else {
          var curKeys = multiEditSelKeys(col);
          if (curKeys.length > 1 && curKeys.indexOf(key) >= 0) {
            paintMultiEditCellSelection(col);
          } else {
            syncMultiEditSingleCell(col, key);
          }
        }
      } else {
        cancelMultiEditDrag(false);
      }
    }

    function attachMultiEditDragListeners() {
      detachMultiEditDragListeners();
      document.addEventListener("mousemove", onMultiEditMouseMove);

    function bindMultiEditCell(col, td, rec, rowIndex, val) {

        clearOtherMultiEditSel(col);

          ev.preventDefault();

        multiEditDragCol = col;

      inp.addEventListener("paste", function (ev) {

        ev.preventDefault();
        ev.stopPropagation();

      inp.addEventListener("focus", function () {

      inp.addEventListener("click", function (ev) {

        if (multiEditJustDragged) {

        }
        if (!multiEditMultiActive(col)) selectCell(td, rowIndex, col);

      inp.addEventListener("input", function () {
        scheduleSaveCell(rec.row_key, cfg.field, inp.value);
        if (selectedCell && selectedCell.rowKey === rec.row_key && selectedCell.col === col) {
          selectedCell.text = inp.value;
          scheduleFormulaBarUpdate(col, rowIndex, inp.value);

        flushSaveForRowField(rec.row_key, cfg.field);

    function excelColLetters(colIndex) {
      var n = Number(colIndex);
      if (!isFinite(n) || n < 0) return "";
      var s = "";
      n++;
      while (n > 0) {
        n--;
        s = String.fromCharCode(65 + (n % 26)) + s;
        n = Math.floor(n / 26);
      }
      return s;
    }

    function excelCellAddr(colIndex, rowIndex) {
      var letters = excelColLetters(colIndex);
      if (!letters || rowIndex == null || rowIndex < 0) return "—";
      return letters + String(rowIndex + 1);
    }

    function resizeFormulaBar() {
      if (!cellFormula) return;
      cellFormula.style.height = "auto";
      cellFormula.style.height = Math.min(120, Math.max(28, cellFormula.scrollHeight)) + "px";
    }

    function clearCellSelection() {
      selectedCell = null;
      tbody.querySelectorAll("td.cell-selected").forEach(function (td) {
        td.classList.remove("cell-selected");
      });
      if (cellAddr) cellAddr.textContent = "—";
      if (cellFormula) {
        cellFormula.value = "";
        resizeFormulaBar();
      }
      if (btnCopyFormula) btnCopyFormula.disabled = true;
    }

    function updateFormulaBar(col, rowIndex, text) {
      var addr = excelCellAddr(COLS.indexOf(col), rowIndex);
      if (addr !== "—" && col) addr = addr + " · " + col;
      if (cellAddr) cellAddr.textContent = addr;
      if (cellFormula) {
        cellFormula.value = text == null ? "" : String(text);
        cellFormula.placeholder = "点击单元格查看完整内容…";
      }
      if (btnCopyFormula) btnCopyFormula.disabled = !cellFormula || !cellFormula.value;
      resizeFormulaBar();
    }

    function updateFormulaBarForMultiEdit(col) {
      if (!col || !isMultiEditCol(col)) return false;
      var keys = multiEditSelKeys(col);
      if (keys.length <= 1) return false;
      var cfg = multiEditCfg(col);
      var vals = keys.map(function (key) {
        var rec = findRowByKey(key);
        return rec && cfg ? getDisplayField(rec, cfg.field) : "";
      });
      var allSame = vals.every(function (v) { return v === vals[0]; });
      var firstIdx = rowKeyIndexInDisplay(keys[0]);
      var lastIdx = rowKeyIndexInDisplay(keys[keys.length - 1]);
      var addr = excelCellAddr(COLS.indexOf(col), firstIdx) + ":" +
        excelCellAddr(COLS.indexOf(col), lastIdx) + " (" + keys.length + ")";
      var segs = multiEditSel[col] && multiEditSel[col].segments ? multiEditSel[col].segments.length : 1;
      if (segs > 1) addr += " +" + (segs - 1);
      if (cellAddr) cellAddr.textContent = addr + " · " + col;
      if (cellFormula) {
        cellFormula.value = allSame ? vals[0] : "";
        cellFormula.placeholder = allSame ? "点击单元格查看完整内容…" : ("(" + keys.length + " 个单元格)");
      }
      if (btnCopyFormula) btnCopyFormula.disabled = false;
      resizeFormulaBar();
      return true;
    }

    function selectCell(td, rowIndex, col, opts) {
      opts = opts || {};
      if (!td || col == null) return;
      tbody.querySelectorAll("td.cell-selected").forEach(function (el) {
        el.classList.remove("cell-selected");
      });
      td.classList.add("cell-selected");
      var tr = td.parentElement;
      var rowKey = tr && tr.dataset.key ? tr.dataset.key : "";
      if (isMultiEditCol(col)) {
        if (!opts.keepMultiEditMulti && !multiEditMultiActive(col)) {
          if (rowKey) setMultiEditOneSegment(col, rowKey, [rowKey], { lastOpAnchorKey: rowKey });
          else clearMultiEditSel(col);
        }
        clearOtherMultiEditSel(col);
      } else {
        clearMultiEditSel("");
      }
      var text = td.textContent || "";
      var inp = td.querySelector("input");
      if (inp) text = inp.value;
      selectedCell = { rowKey: rowKey, rowIndex: rowIndex, col: col, text: text };
      if (!updateFormulaBarForMultiEdit(col)) updateFormulaBar(col, rowIndex, text);
      if (isMultiEditCol(col)) paintMultiEditCellSelection(col);
    }

    function widthStoreKey(pre) {
      return WIDTH_STORE_KEY + ":" + String(pre || "_");
    }

    function loadWidthMap(pre) {
      try {
        var raw = localStorage.getItem(widthStoreKey(pre));
        if (!raw) return Object.create(null);
        var parsed = JSON.parse(raw);
        if (!parsed || typeof parsed !== "object") return Object.create(null);
        return parsed;
      } catch (_) {
        return Object.create(null);
      }
    }

    function saveWidthMap(pre) {
      try {
        localStorage.setItem(widthStoreKey(pre), JSON.stringify(colWidths));
      } catch (_) {}
    }

    function defaultColWidth(col) {
      return DEFAULT_WIDTH_BY_COL[col] || 96;
    }

    function getColWidth(col) {
      var w = Number(colWidths[col]);
      if (isFinite(w) && w > 0) return w;
      return defaultColWidth(col);
    }

    function renderColgroup() {
      if (!colgroup) return;
      colgroup.innerHTML = "";
      COLS.forEach(function (c) {
        var col = document.createElement("col");
        col.dataset.col = c;
        colgroup.appendChild(col);
      });
      syncTableLayout();
    }

    function syncTableLayout() {
      if (!colgroup) return;
      var total = 0;
      COLS.forEach(function (c, i) {
        var w = getColWidth(c);
        total += w;
        var colEl = colgroup.children[i];
        if (colEl) {
          colEl.style.width = w + "px";
          colEl.style.minWidth = w + "px";
          colEl.style.maxWidth = w + "px";
        }
      });
      var table = colgroup.parentElement;
      if (table) {
        table.style.width = Math.max(total, 1) + "px";
        table.style.minWidth = Math.max(total, 1) + "px";
      }
      if (thead) {
        var ths = thead.querySelectorAll("th");
        COLS.forEach(function (c, i) {
          var w = getColWidth(c);
          if (ths[i]) {
            ths[i].style.width = w + "px";
            ths[i].style.minWidth = w + "px";
            ths[i].style.maxWidth = w + "px";
          }
        });
      }
    }

    function applyColWidth(col, width) {
      var w = Math.round(width);
      if (!isFinite(w) || w < 1) w = 1;
      colWidths[col] = w;
      syncTableLayout();
    }

    function startColResize(col, th, startX) {
      resizeState = {
        col: col,
        startX: startX,
        startW: getColWidth(col)
      };
      document.body.classList.add("col-resizing");
    }

    function onColResizeMove(ev) {
      if (!resizeState) return;
      applyColWidth(resizeState.col, resizeState.startW + ev.clientX - resizeState.startX);
    }

    function endColResize() {
      if (!resizeState) return;
      syncTableLayout();
      saveWidthMap(bindPrefix.value);
      resizeState = null;
      document.body.classList.remove("col-resizing");
      document.removeEventListener("mousemove", onColResizeMove);
      document.removeEventListener("mouseup", endColResize);

    function bindColResize(th, col) {
      var handle = document.createElement("span");

    function renderHead() {

      var activeSortDir = sortState && sortState.col ? sortState.dir : effectiveSortDir();

    function loadSortState(pre) {
      try {
        var raw = sessionStorage.getItem(SORT_STORE_KEY + ":" + String(pre || "_"));
        if (!raw) return null;
        var parsed = JSON.parse(raw);
        if (!parsed || !parsed.col || (parsed.dir !== "asc" && parsed.dir !== "desc")) return null;
        return { col: parsed.col, dir: parsed.dir };
      } catch (_) {
        return null;
      }
    }

    function saveSortState(pre) {
      try {
        var key = SORT_STORE_KEY + ":" + String(pre || "_");
        if (!sortState || !sortState.col) sessionStorage.removeItem(key);
        else sessionStorage.setItem(key, JSON.stringify(sortState));
      } catch (_) {}
    }

    function effectiveSortCol() {
      if (sortState && sortState.col && COLS.indexOf(sortState.col) >= 0) return sortState.col;
      if (COLS.indexOf(DEFAULT_SORT_COL) >= 0) return DEFAULT_SORT_COL;
      if (COLS.indexOf(DEFAULT_SORT_FALLBACK) >= 0) return DEFAULT_SORT_FALLBACK;
      return COLS[0] || "";
    }

    function effectiveSortDir() {
      if (sortState && sortState.col) return sortState.dir === "asc" ? "asc" : "desc";
      return "desc";
    }

    function cycleSortCol(col) {
      if (!col) return;
      if (!sortState || sortState.col !== col) {
        sortState = { col: col, dir: "asc" };
      } else if (sortState.dir === "asc") {
        sortState.dir = "desc";
      } else {
        sortState = null;
      }
      saveSortState(bindPrefix.value);
      renderHead();
      renderBody();
    }

    function resetSortState() {
      sortState = null;
      saveSortState(bindPrefix.value);
      renderHead();
    }

    function parseDateMs(text) {
      var s = String(text == null ? "" : text).trim();
      if (!s) return NaN;
      var m = s.match(/^(\d{4})[-/](\d{1,2})[-/](\d{1,2})(?:[ T](\d{1,2}):(\d{2})(?::(\d{2}))?)?/);
      if (m) {
        return new Date(
          Number(m[1]), Number(m[2]) - 1, Number(m[3]),
          Number(m[4] || 0), Number(m[5] || 0), Number(m[6] || 0)
        ).getTime();
      }
      var t = Date.parse(s);
      return isFinite(t) ? t : NaN;
    }

    function sortKeyFor(rec, col) {
      var raw = filterCellRaw(rec, col);
      if (!raw) return { kind: "empty", v: "" };
      if (DATE_COLS[col]) {
        var ms = parseDateMs(raw);
        if (isFinite(ms)) return { kind: "date", v: ms };
      }
      if (NUM_COLS[col]) {
        var digits = raw.replace(/\D/g, "");
        if (digits) return { kind: "num", v: Number(digits) };
        var n = Number(raw);
        if (isFinite(n)) return { kind: "num", v: n };
      }
      return { kind: "text", v: raw.toLowerCase() };
    }

    function compareSortKeys(ka, kb, dir) {
      if (ka.kind === "empty" && kb.kind !== "empty") return 1;
      if (kb.kind === "empty" && ka.kind !== "empty") return -1;
      if (ka.kind === "empty" && kb.kind === "empty") return 0;
      var av = ka.v;
      var bv = kb.v;
      var cmp = 0;
      if (ka.kind === "num" || ka.kind === "date") {
        cmp = av === bv ? 0 : (av < bv ? -1 : 1);
      } else {
        cmp = String(av).localeCompare(String(bv), "zh-CN");
      }
      return dir === "desc" ? -cmp : cmp;
    }

    function sortedDisplayRowsUncached() {
      var rows = filteredRows().slice();
      var col = effectiveSortCol();
      if (!col) return rows;
      var dir = effectiveSortDir();
      rows.sort(function (a, b) {
        var cmp = compareSortKeys(sortKeyFor(a, col), sortKeyFor(b, col), dir);
        if (cmp !== 0) return cmp;
        var ak = String(a.row_key || "");
        var bk = String(b.row_key || "");
        return ak < bk ? -1 : ak > bk ? 1 : 0;
      });
      return rows;
    }

    function sortedDisplayRows() {
      return displayRowList();
    }

    function scheduleSaveCell(rowKey, field, value) {
      value = value == null ? "" : String(value);
      setDraft(rowKey, field, value);
      var timerKey = draftKey(rowKey, field);
      var rec = findRowByKey(rowKey);
      if (getServerField(rec, field) === value && !(drafts[timerKey] && drafts[timerKey].status === "failed")) {
        if (saveTimers[timerKey]) {
          clearTimeout(saveTimers[timerKey]);
          saveTimers[timerKey] = null;
        }
        delete pendingSaves[timerKey];
        markInputSaveState(findInputByRowField(rowKey, field), "");
        return;
      }
      pendingSaves[timerKey] = { rowKey: rowKey, field: field, value: value };
      if (saveTimers[timerKey]) clearTimeout(saveTimers[timerKey]);
      saveTimers[timerKey] = setTimeout(function () {
        saveTimers[timerKey] = null;
        flushScheduledSave(timerKey);
      }, SAVE_DEBOUNCE_MS);
    }

    function countUnsavedCells() {
      captureLiveEditsToPending();
      var keys = Object.create(null);
      Object.keys(drafts).forEach(function (k) { keys[k] = true; });
      Object.keys(pendingSaves).forEach(function (k) { keys[k] = true; });
      Object.keys(saveTimers).forEach(function (k) {
        if (saveTimers[k]) keys[k] = true;
      });
      return Object.keys(keys).length;
    }

    function markInputSaveState(inp, state) {
      if (!inp || !inp.dataset) return;
      inp.dataset.saveState = state || "";
      inp.classList.toggle("save-failed", state === "failed");
      inp.classList.toggle("save-pending", state === "pending");
    }

    function findInputByRowField(rowKey, field) {
      if (!tbody || !rowKey || !field) return null;
      var trs = tbody.querySelectorAll("tr[data-key]");
      for (var i = 0; i < trs.length; i++) {
        if (trs[i].dataset.key === rowKey) {
          return trs[i].querySelector('input[data-field="' + field + '"]');
        }
      }
      return null;
    }

    function flushScheduledSave(timerKey) {
      var job = pendingSaves[timerKey];
      if (!job) return;
      delete pendingSaves[timerKey];
      var inp = findInputByRowField(job.rowKey, job.field);
      markInputSaveState(inp, "pending");
      saveCell(job.rowKey, job.field, job.value, { silent: true })
        .then(function () {
          markInputSaveState(findInputByRowField(job.rowKey, job.field), "saved");
          if (saveRetryTimers[timerKey]) {
            clearTimeout(saveRetryTimers[timerKey]);
            saveRetryTimers[timerKey] = null;
          }
        })
        .catch(function (e) {
          var retry = (job._retry || 0) + 1;
          if (retry > SAVE_RETRY_MAX) {
            pendingSaves[timerKey] = job;
            markInputSaveState(findInputByRowField(job.rowKey, job.field), "failed");
            setStatus(appStatus, "保存失败（已重试 " + SAVE_RETRY_MAX + " 次）：" +
              (e && e.message ? e.message : "请检查网络后重试"), "err");
            return;
          }
          job._retry = retry;
          pendingSaves[timerKey] = job;
          var delay = Math.min(30000, SAVE_DEBOUNCE_MS * Math.pow(2, retry - 1));
          if (saveRetryTimers[timerKey]) clearTimeout(saveRetryTimers[timerKey]);
          saveRetryTimers[timerKey] = setTimeout(function () {
            saveRetryTimers[timerKey] = null;
            flushScheduledSave(timerKey);
          }, delay);
        });
    }

    function isDirtyEditInput(inp, rowKey, field) {
      if (!inp || !rowKey || !field) return false;
      var timerKey = draftKey(rowKey, field);
      if (pendingSaves[timerKey] || saveTimers[timerKey] || drafts[timerKey]) return true;
      if (inp.classList && (inp.classList.contains("save-pending") || inp.classList.contains("save-failed"))) {
        return true;
      }
      var rec = findRowByKey(rowKey);
      var cur = inp.value == null ? "" : String(inp.value);
      return cur !== getServerField(rec, field);
    }

    function captureLiveEditsToPending() {
      document.querySelectorAll("td.editable input, td.multi-edit-cell input").forEach(function (inp) {
        var tr = inp.closest("tr");
        if (!tr || !tr.dataset.key) return;
        var rowKey = tr.dataset.key;
        var field = inp.dataset.field || "";
        if (!field) return;
        var value = inp.value == null ? "" : String(inp.value);
        var rec = findRowByKey(rowKey);
        if (value === getServerField(rec, field) && !isDraft(rowKey, field)) return;
        if (value === getServerField(rec, field)) return;
        setDraft(rowKey, field, value);
        pendingSaves[draftKey(rowKey, field)] = { rowKey: rowKey, field: field, value: value };
      });
    }

    function applyPendingEditsToRowsCache(opts) {
      /* 重构后 rowsCache 只保留云端快照，草稿走 drafts，不再把 DOM 写回缓存。 */
      opts = opts || {};
      if (!opts.skipCapture) captureLiveEditsToPending();
    }

    async function flushAllPendingSavesAsync() {
      captureLiveEditsToPending();
      Object.keys(saveTimers).forEach(function (k) {
        if (saveTimers[k]) {
          clearTimeout(saveTimers[k]);
          saveTimers[k] = null;
        }
      });
      var keys = Object.keys(pendingSaves);
      var ok = 0;
      var fail = 0;
      var lastErr = "";
      for (var i = 0; i < keys.length; i++) {
        var timerKey = keys[i];
        var job = pendingSaves[timerKey];
        delete pendingSaves[timerKey];
        if (!job) continue;
        try {
          await saveCell(job.rowKey, job.field, job.value, { silent: true });
          ok++;
        } catch (e) {
          fail++;
          lastErr = e && e.message ? e.message : String(e);
          pendingSaves[timerKey] = job;
          markInputSaveState(findInputByRowField(job.rowKey, job.field), "failed");
        }
      }
      if (fail) {
        throw new Error("有 " + fail + " 格未保存成功" + (lastErr ? ("：" + lastErr) : ""));
      }
      return ok;
    }

    async function replayKeepaliveFailures() {
      var raw = "";
      try { raw = localStorage.getItem(KEEPALIVE_FAIL_KEY) || ""; } catch (_) {}
      if (!raw) return 0;
      var stash = [];
      try {
        stash = JSON.parse(raw);
        if (!Array.isArray(stash)) stash = [];
      } catch (_) {
        stash = [];
      }
      if (!stash.length) return 0;
      var remain = [];
      var ok = 0;
      for (var i = 0; i < stash.length; i++) {
        var item = stash[i];
        if (!item || !item.rowKey || !item.field) continue;
        try {
          var remote = await sbFetch(
            "/rest/v1/t11_rows?row_key=eq." + encodeURIComponent(item.rowKey) +
            "&select=ops,eta,confirm_sku,snapshot,updated_at"
          );
          var rec = Array.isArray(remote) && remote[0] ? remote[0] : null;
          var cloudVal = getServerField(rec, item.field);
          var want = item.value == null ? "" : String(item.value);
          if (cloudVal === want) continue;
          var cloudAt = rec && rec.updated_at ? Date.parse(rec.updated_at) : 0;
          if (cloudAt && item.at && cloudAt > Number(item.at)) continue;
          await saveCell(item.rowKey, item.field, item.value, { silent: true, force: true });
          ok++;
        } catch (_) {
          remain.push(item);
        }
      }
      try {
        if (remain.length) localStorage.setItem(KEEPALIVE_FAIL_KEY, JSON.stringify(remain));
        else localStorage.removeItem(KEEPALIVE_FAIL_KEY);
      } catch (_) {}
      return ok;
    }

    function stashKeepaliveFailure(rowKey, field, value) {
      try {
        var stash = JSON.parse(localStorage.getItem(KEEPALIVE_FAIL_KEY) || "[]");
        if (!Array.isArray(stash)) stash = [];
        stash.push({
          rowKey: rowKey,
          field: field,
          value: value,
          at: Date.now()
        });
        if (stash.length > 200) stash = stash.slice(-200);
        localStorage.setItem(KEEPALIVE_FAIL_KEY, JSON.stringify(stash));
      } catch (_) {}
    }

    function saveCellKeepalive(rowKey, field, value) {
      if (!supabaseUrl || !anonKey || !rowKey || !field) return;
      value = value == null ? "" : String(value);
      var recNow = findRowByKey(rowKey);
      if (getServerField(recNow, field) === value) {
        clearDraft(rowKey, field);
        return;
      }
      var body = { updated_at: new Date().toISOString() };
      if (isSnapshotField(field)) {
        var cur = null;
        for (var ci = 0; ci < rowsCache.length; ci++) {
          if (rowsCache[ci].row_key === rowKey) {
            cur = rowsCache[ci];
            break;
          }
        }
        var curSnap = cur && cur.snapshot && typeof cur.snapshot === "object"
          ? Object.assign({}, cur.snapshot) : {};
        curSnap[snapshotFieldKey(field)] = value;
        body.snapshot = curSnap;
      } else {
        body[field] = value;
      }
      try {
        fetch(supabaseUrl + "/rest/v1/t11_rows?row_key=eq." + encodeURIComponent(rowKey), {
          method: "PATCH",
          headers: hdr({ Prefer: "return=minimal" }),
          body: JSON.stringify(body),
          keepalive: true,
          cache: "no-store"
        }).catch(function () {
          stashKeepaliveFailure(rowKey, field, value);
        });
      } catch (_) {
        stashKeepaliveFailure(rowKey, field, value);
      }
    }

    function flushAllPendingSavesKeepalive() {
      captureLiveEditsToPending();
      Object.keys(saveTimers).forEach(function (k) {
        if (saveTimers[k]) {
          clearTimeout(saveTimers[k]);
          saveTimers[k] = null;
        }
      });
      Object.keys(pendingSaves).forEach(function (timerKey) {
        var job = pendingSaves[timerKey];
        delete pendingSaves[timerKey];
        if (!job) return;
        saveCellKeepalive(job.rowKey, job.field, job.value);
      });
    }

    function flushSaveForRowField(rowKey, field) {
      var timerKey = rowKey + "\u0001" + field;
      if (saveTimers[timerKey]) {
        clearTimeout(saveTimers[timerKey]);
        saveTimers[timerKey] = null;

    function filterCellRaw(rec, col) {

    function rowSearchHay(rec) {

      var parts = [
        rec.order_no, rec.sku, rec.eta, rec.ops,
        rec.row_key, rec.bind_prefix
      ];
      Object.keys(snap).forEach(function (k) {
        var v = snap[k];
        if (v != null && v !== "") parts.push(v);
      });
      COLS.forEach(function (c) {
        parts.push(filterCellRaw(rec, c));
      });
      return parts.join(" ").toLowerCase();

    function loadColFilters(pre) {
      try {
        var raw = sessionStorage.getItem(FILTER_STORE_KEY + ":" + String(pre || "_"));
        if (!raw) return Object.create(null);
        var parsed = JSON.parse(raw);
        if (!parsed || typeof parsed !== "object") return Object.create(null);
        return parsed;
      } catch (_) {
        return Object.create(null);
      }
    }

    function saveColFilters(pre) {

    function colFilterActiveCount() {
      var n = 0;
      Object.keys(colFilters || {}).forEach(function (c) {
        if (colFilters[c]) n++;
      });
      return n;
    }

    function rowPassesColFilters(rec, exceptCol) {
      var cols = Object.keys(colFilters || {});
      for (var i = 0; i < cols.length; i++) {
        var col = cols[i];
        if (exceptCol && col === exceptCol) continue;
        if (!COLS.length || COLS.indexOf(col) < 0) continue;
        var selected = colFilters[col];
        if (!selected) continue;
        var val = filterCellRaw(rec, col);
        if (!Object.prototype.hasOwnProperty.call(selected, val)) return false;
        if (!selected[val]) return false;
      }
      return true;
    }

    function rowPassesSearch(rec) {
      var q = String(searchBox.value || "").trim().toLowerCase();
      if (!q) return true;
      return rowSearchHay(rec).indexOf(q) >= 0;
    }

    function rowPassesFilterContext(rec, exceptCol) {
      if (!rowPassesSearch(rec)) return false;
      return rowPassesColFilters(rec, exceptCol);
    }

    function collectColFilterValues(col) {
      var map = Object.create(null);
      rowsCache.forEach(function (rec) {
        if (!rowPassesFilterContext(rec, col)) return;
        var v = filterCellRaw(rec, col);
        map[v] = (map[v] || 0) + 1;
      });
      return Object.keys(map).sort(function (a, b) {
        if (a === "" && b !== "") return 1;
        if (b === "" && a !== "") return -1;
        return a < b ? -1 : a > b ? 1 : 0;
      }).map(function (v) {
        return { value: v, count: map[v] };
      });
    }

    function renderColFilterList(col) {
      if (!colFilterList) return;
      colFilterList.innerHTML = "";

        var span = document.createElement("span");

        lab.appendChild(cb);
        lab.appendChild(span);
        lab.appendChild(cnt);
        lab.addEventListener("click", function (ev) {
          if (ev.target === cb) return;
          ev.preventDefault();
          cb.checked = !cb.checked;
          syncFilterAllBtnLabel();

        colFilterList.appendChild(lab);

    function openColFilterPop(col, anchor) {
      filterPopCol = col;
      filterPopAnchor = anchor;
      filterDraft = Object.create(null);

      if (existing) {

        });

      if (colFilterTitle) colFilterTitle.textContent = "筛选 · " + col;

    function applyColFilterDraft() {
      if (!filterPopCol || !colFilterList) return;
      var selected = Object.create(null);
      var anyUnchecked = false;
      var anyChecked = false;
      colFilterList.querySelectorAll(".col-filter-item").forEach(function (lab) {
        if (lab.hidden) return;
        var cb = lab.querySelector("input[type=checkbox]");
        if (!cb) return;
        var v = lab.getAttribute("data-search");
        if (v === "（空白）") v = "";
        selected[v] = cb.checked;
        if (cb.checked) anyChecked = true;
        else anyUnchecked = true;
      });
      if (!anyChecked) {
        setStatus(appStatus, "至少保留一个勾选项", "err");
        return;
      }
      if (anyUnchecked) colFilters[filterPopCol] = selected;
      else delete colFilters[filterPopCol];
      saveColFilters(bindPrefix.value);
      closeColFilterPop();
      syncFilterHeadBadges();
      renderBody();
      updateFilterStatusLine();

    function clearColFilter(col) {
      if (col) delete colFilters[col];
      else {
        colFilters = Object.create(null);
        searchBox.value = "";
        resetSortState();
      }
      saveColFilters(bindPrefix.value);
      closeColFilterPop();
      syncFilterHeadBadges();
      if (!col) renderHead();
      renderBody();
      updateFilterStatusLine();

      thead.querySelectorAll(".col-filter-btn").forEach(function (btn) {

    function updateFilterStatusLine() {
      var base = rowsCache.length;
      var shown = sortedDisplayRows().length;
      var fc = colFilterActiveCount();
      var q = String(searchBox.value || "").trim();
      var parts = ["共 " + base + " 行"];
      if (shown !== base || fc || q) parts.push("显示 " + shown + " 行");
      var opsFilled = countOpsFilledInCache(rowsCache);
      if (base) parts.push("运营反馈已填 " + opsFilled + "/" + base);
      var unsaved = countUnsavedCells();
      if (unsaved) parts.push("待保存 " + unsaved + " 格");
      if (fc) parts.push("列筛选×" + fc);
      if (q) parts.push("搜索");
      var sc = effectiveSortCol();
      if (sc) parts.push("排序 " + sc + (effectiveSortDir() === "asc" ? "↑" : "↓"));
      if (bindPrefix.value) parts.push("（" + bindPrefix.value + "）");
      setStatus(appStatus, parts.join(" · "), "ok");
    }
